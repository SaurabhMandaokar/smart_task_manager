<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Task Board</title>

  <!-- Flatpickr Date Picker CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .flatpickr-calendar { background: #1f2937; color: #e5e7eb; }
    .flatpickr-day { color: #e5e7eb; }
    .flatpickr-day:hover { background: #374151; }
    .flatpickr-day.selected { background: #3b82f6; border-color: #3b82f6; }
    .flatpickr-month, .flatpickr-current-month { color: #e5e7eb; }
    .flatpickr-prev-month, .flatpickr-next-month { color: #9ca3af; }
    .flatpickr-prev-month:hover, .flatpickr-next-month:hover { color: #e5e7eb; }
    .flatpickr-input {
      background: #1f2937 !important;
      color: #e5e7eb !important;
      border: 1px solid #374151 !important;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-6">
  <h1 class="text-3xl font-bold mb-8 text-center">🧠 TASKS</h1>

  <!-- Priority Tasks Horizontal Bar -->
  <div class="priority-bar flex overflow-x-auto gap-4 mb-8 p-4 bg-gray-800 rounded-lg shadow-lg" id="priorityBar">
    <h3 class="min-w-[120px] text-lg font-semibold text-red-400">🔥 Priority</h3>
  </div>

  <!-- 5 Vertical Columns -->
  <div class="column-container flex overflow-x-auto gap-4">
    <div id="past" class="column min-w-[250px] flex-shrink-0 bg-gray-800 p-4 rounded-lg shadow-lg"></div>
    <div id="lastWeek" class="column min-w-[250px] flex-shrink-0 bg-gray-800 p-4 rounded-lg shadow-lg"></div>
    <div id="thisWeek" class="column min-w-[250px] flex-shrink-0 bg-gray-800 p-4 rounded-lg shadow-lg"></div>
    <div id="nextWeek" class="column min-w-[250px] flex-shrink-0 bg-gray-800 p-4 rounded-lg shadow-lg"></div>
    <div id="future" class="column min-w-[250px] flex-shrink-0 bg-gray-800 p-4 rounded-lg shadow-lg"></div>
  </div>

  <button id="createTaskBtn" class="mt-6 px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-500 transition-colors">Create Task</button>

  <div id="taskFormContainer" class="mt-6 p-6 bg-gray-800 rounded-lg shadow-lg hidden max-w-md mx-auto">
    <input id="taskTitle" placeholder="Title" class="w-full p-3 mb-4 bg-gray-700 text-gray-100 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
    <input id="taskDueDate" placeholder="Due Date" class="w-full p-3 mb-4 bg-gray-700 text-gray-100 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
    <input id="taskDesc" placeholder="Description" class="w-full p-3 mb-4 bg-gray-700 text-gray-100 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
    <select id="taskPriority" class="w-full p-3 mb-4 bg-gray-700 text-gray-100 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <option value="Low">Low</option>
      <option value="Medium">Medium</option>
      <option value="ASAP">ASAP</option>
    </select>
    <select id="taskStatus" class="w-full p-3 mb-4 bg-gray-700 text-gray-100 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <option value="to-do">To Do</option>
      <option value="in-progress">In Progress</option>
      <option value="done">Done</option>
    </select>
    <button onclick="saveTask()" class="w-full p-3 bg-blue-600 text-white rounded-lg hover:bg-blue-500 transition-colors">Save Task</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script>
    const tasks = [];
    let selectedTaskId = null;

    flatpickr("#taskDueDate", {
      dateFormat: "Y-m-d",
      theme: "dark"
    });

    async function fetchTasks() {
      const res = await fetch('/tasks');
      const data = await res.json();
      tasks.splice(0, tasks.length, ...data);
      displayTasks();
    }

    function displayTasks() {
      const today = new Date();

      const getWeekStart = (date, offset) => {
        const d = new Date(date);
        d.setDate(d.getDate() - d.getDay() + 1 + (offset * 7)); // Monday start
        d.setHours(0, 0, 0, 0);
        return d;
      };

      const formatDate = (date) => {
        return date.toLocaleDateString("en-US", { month: "short", day: "numeric" });
      };

      const formatDateRange = (startDate) => {
        const endDate = new Date(startDate);
        endDate.setDate(endDate.getDate() + 6);
        return `${formatDate(startDate)} – ${formatDate(endDate)}`;
      };

      const thisWeekStart = getWeekStart(today, 0);
      const nextWeekStart = getWeekStart(today, 1);
      const lastWeekStart = getWeekStart(today, -1);
      const weekAfterNextStart = getWeekStart(today, 2);

      const headings = {
        past: "Past",
        lastWeek: `Last Week<br><span class="text-sm text-gray-400">${formatDateRange(lastWeekStart)}</span>`,
        thisWeek: `This Week<br><span class="text-sm text-gray-400">${formatDateRange(thisWeekStart)}</span>`,
        nextWeek: `Next Week<br><span class="text-sm text-gray-400">${formatDateRange(nextWeekStart)}</span>`,
        future: "Future"
      };

      ["past", "lastWeek", "thisWeek", "nextWeek", "future"].forEach(id => {
        const column = document.getElementById(id);
        column.innerHTML = `<h3 class="text-lg font-semibold text-center border-b border-gray-600 pb-2 mb-4">${headings[id]}</h3>`;
      });

      document.getElementById("priorityBar").innerHTML = `<h3 class="min-w-[120px] text-lg font-semibold text-red-400">🔥 Priority</h3>`;

      tasks.forEach((task) => {
        const taskDate = new Date(task.dueDate);
        const taskBox = document.createElement('div');
        taskBox.className = 'task bg-gray-700 p-4 mb-4 rounded-lg shadow hover:bg-gray-600 transition-colors cursor-pointer';
        taskBox.innerHTML = `<strong class="text-gray-100">${task.title}</strong><br/><small class="text-gray-400">${task.dueDate} – ${task.priority} – ${task.status}</small>`;

        taskBox.onclick = () => {
          selectedTaskId = task.id;
          document.getElementById('taskTitle').value = task.title;
          document.getElementById('taskDueDate').value = task.dueDate;
          document.getElementById('taskDesc').value = task.description;
          document.getElementById('taskPriority').value = task.priority;
          document.getElementById('taskStatus').value = task.status;
          document.getElementById('taskFormContainer').classList.remove('hidden');
        };

        if (task.priority === 'ASAP') {
          document.getElementById('priorityBar').appendChild(taskBox);
        } else if (taskDate < lastWeekStart) {
          document.getElementById('past').appendChild(taskBox);
        } else if (taskDate >= lastWeekStart && taskDate < thisWeekStart) {
          document.getElementById('lastWeek').appendChild(taskBox);
        } else if (taskDate >= thisWeekStart && taskDate < nextWeekStart) {
          document.getElementById('thisWeek').appendChild(taskBox);
        } else if (taskDate >= nextWeekStart && taskDate < weekAfterNextStart) {
          document.getElementById('nextWeek').appendChild(taskBox);
        } else {
          document.getElementById('future').appendChild(taskBox);
        }
      });
    }

    async function saveTask() {
      const task = {
        title: document.getElementById('taskTitle').value,
        dueDate: document.getElementById('taskDueDate').value,
        description: document.getElementById('taskDesc').value,
        priority: document.getElementById('taskPriority').value,
        status: document.getElementById('taskStatus').value
      };

      if (selectedTaskId !== null) {
        const res = await fetch(`/tasks/${selectedTaskId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(task)
        });
        if (res.ok) {
          const index = tasks.findIndex(t => t.id === selectedTaskId);
          if (index !== -1) tasks[index] = { ...task, id: selectedTaskId };
        }
      } else {
        const res = await fetch('/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(task)
        });
        if (res.ok) {
          const newTask = await res.json();
          tasks.push({ ...task, id: newTask.id || null });
        }
      }

      displayTasks();
      document.getElementById('taskFormContainer').classList.add('hidden');
      selectedTaskId = null;
    }

    document.getElementById('createTaskBtn').onclick = () => {
      document.getElementById('taskFormContainer').classList.remove('hidden');
      selectedTaskId = null;
      document.getElementById('taskTitle').value = '';
      document.getElementById('taskDueDate').value = '';
      document.getElementById('taskDesc').value = '';
      document.getElementById('taskPriority').value = 'Medium';
      document.getElementById('taskStatus').value = 'to-do';
    };

    fetchTasks();
  </script>
</body>
</html>
